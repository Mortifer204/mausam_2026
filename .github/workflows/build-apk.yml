name: Build Mausam Android APK

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        env:
          VITE_API_URL: https://mausam-2026.onrender.com
        run: npm run build

      - name: Copy Web Assets to Capacitor Android
        run: |
          node node_modules/@capacitor/cli/bin/capacitor copy android
          test -f android/app/src/main/assets/capacitor.plugins.json || echo "[]" > android/app/src/main/assets/capacitor.plugins.json

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mausam-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
